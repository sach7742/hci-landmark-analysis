<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="8" />
  <rect width="100%" height="100%" fill="none" stroke="#e1e4e8" stroke-width="2" rx="8" />
  
  <!-- Title -->
  <text x="30" y="45" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#0b5cad">Fitts's Law Motor Benchmark Task Model</text>
  <text x="30" y="70" font-family="-apple-system, sans-serif" font-size="13" fill="#555555">Target Acquisition Paradigm: MT = a + b · log₂(D/W + 1)</text>

  <!-- Interactive Area Simulation -->
  <rect x="40" y="100" width="720" height="240" fill="#f8f9fa" stroke="#1a1a1a" stroke-width="2" rx="4" />
  
  <!-- Start Circle -->
  <circle cx="120" cy="220" r="22" fill="#1a1a1a" />
  <circle cx="120" cy="220" r="28" fill="none" stroke="#0b5cad" stroke-width="3" />
  <text x="120" y="270" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Start Point</text>

  <!-- Target Box -->
  <rect x="580" y="120" width="80" height="200" fill="#e8f0f8" stroke="#0b5cad" stroke-width="3" rx="2" />
  <text x="620" y="225" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b5cad">Target</text>

  <!-- Distance Arrow (D) -->
  <line x1="120" y1="310" x2="620" y2="310" stroke="#0b5cad" stroke-width="2" stroke-dasharray="4" />
  <polygon points="120,310 128,306 128,314" fill="#0b5cad" />
  <polygon points="620,310 612,306 612,314" fill="#0b5cad" />
  <text x="370" y="303" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b5cad">Distance (D = 600px)</text>

  <!-- Width Arrow (W) -->
  <line x1="580" y1="105" x2="660" y2="105" stroke="#d9376e" stroke-width="2" />
  <polygon points="580,105 586,102 586,108" fill="#d9376e" />
  <polygon points="660,105 654,102 654,108" fill="#d9376e" />
  <text x="620" y="98" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#d9376e">Width (W = 80px)</text>

  <!-- Trajectory Path -->
  <path d="M 142 220 Q 360 170 578 215" fill="none" stroke="#0b5cad" stroke-width="2" stroke-dasharray="6,6" />
</svg>

